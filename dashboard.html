<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | RedPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

  
  <nav class="navbar dashboard-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fa-solid fa-droplet pulse"></i>
        <span>RedPulse <span class="nav-sub">Dashboard</span></span>
      </a>
      <div class="user-profile-menu">
        <div class="user-avatar" id="user-avatar-tag">U</div>
        <div class="user-meta">
          <span class="user-name" id="profile-name">Loading...</span>
          <span class="user-role" id="profile-role-badge">Role</span>
        </div>
        <button onclick="showProfilePanel()" class="btn-icon-logout profile-nav-btn" title="My Profile">
          <i class="fa-solid fa-user"></i>
        </button>
        <button onclick="handleLogout()" class="btn-icon-logout" title="Log Out">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </nav>

  
  <main class="dashboard-main container">
    
    
    <div id="dashboard-loader" class="dashboard-loader">
      <i class="fa-solid fa-droplet fa-spin loader-icon"></i>
      <p>Synchronizing with clinical network...</p>
    </div>

    
    <section id="panel-donor" class="dashboard-panel hidden">
      <div class="dashboard-grid">
        
        <div class="grid-col-4">
          <div class="card donor-profile-card">
            <div class="blood-bag">
              <span class="blood-type-display" id="donor-blood-type">O-</span>
            </div>
            <h3 id="donor-profile-name">Donor Name</h3>
            <p id="donor-profile-location"><i class="fa-solid fa-location-dot"></i> Location</p>
            
            <hr class="card-divider">
            
            <div class="status-toggle-wrapper">
              <span>Donation Availability</span>
              <label class="switch">
                <input type="checkbox" id="donor-availability-toggle" onchange="toggleDonorAvailability(this.checked)">
                <span class="slider round"></span>
              </label>
            </div>
            <p class="meta-note" id="availability-text">You are listed as active for urgent matching.</p>
          </div>

          <div class="card callout-card">
            <h4><i class="fa-solid fa-circle-check text-red"></i> Record a Donation</h4>
            <p>Did you recently donate blood at a clinic or hospital? Log it here to request verification points.</p>
            <form id="donation-log-form" onsubmit="submitDonationLog(event)">
              <div class="input-group">
                <label for="donated-units">Units Donated (mL / Bags)</label>
                <input type="number" id="donated-units" required min="1" max="5" value="1">
              </div>
              <div class="input-group">
                <label for="donation-date">Donation Date</label>
                <input type="date" id="donation-date" required>
              </div>
              <button type="submit" class="btn-primary btn-block">Log Donation</button>
            </form>
          </div>
        </div>

        
        <div class="grid-col-8">
          <div class="card">
            <h3 class="card-title">…
